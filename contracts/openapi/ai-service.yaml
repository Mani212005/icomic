openapi: 3.1.0
info:
  title: Icomic AI Service Internal API
  description: Internal HTTP contract between Go API backend and Python FastAPI AI service.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development AI service

paths:
  /internal/v1/layout-lettering:
    post:
      summary: Deterministic local lettering layout, no provider call
      operationId: layoutLettering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetteringDocument'
      responses:
        '200':
          description: Replacement vector layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetteringLayout'
  /healthz:
    get:
      summary: Health check
      operationId: checkHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /internal/v1/analyze-script:
    post:
      summary: Analyze script and generate character profiles and chapter breakdown
      operationId: analyzeScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeScriptRequest'
      responses:
        '200':
          description: Script analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeScriptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/generate-character-reference:
    post:
      summary: Generate character reference image
      operationId: generateCharacterReference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCharacterReferenceRequest'
      responses:
        '200':
          description: Character reference generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateCharacterReferenceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/generate-chapter-outline:
    post:
      summary: Generate chapter outline from script and approved characters
      operationId: generateChapterOutline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateChapterOutlineRequest'
      responses:
        '200':
          description: Chapter outline generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateChapterOutlineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/generate-panel-text:
    post:
      summary: Generate panel text for a chapter
      operationId: generatePanelText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePanelTextRequest'
      responses:
        '200':
          description: Panel text generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratePanelTextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/generate-draft-sketch:
    post:
      summary: Generate one rough draft sketch image per page
      operationId: generateDraftSketch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDraftSketchRequest'
      responses:
        '200':
          description: Draft sketch generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateDraftSketchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/generate-line-art:
    post:
      summary: Generate final black-and-white line art per page after draft approval
      operationId: generateLineArt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateLineArtRequest'
      responses:
        '200':
          description: Line art generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateLineArtResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/generate-painted-page:
    post:
      summary: Generate one finished painted page per page
      operationId: generatePaintedPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePaintedPageRequest'
      responses:
        '200':
          description: Finished painted page generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratePaintedPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/suggest-colour-palette:
    post:
      summary: Suggest colour palette for a page
      operationId: suggestColourPalette
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestColourPaletteRequest'
      responses:
        '200':
          description: Colour palette suggested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestColourPaletteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/store-colour-image:
    post:
      summary: Store a client-coloured page image separately from its line art
      operationId: storeColourImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreColourImageRequest'
      responses:
        '200':
          description: Coloured page image stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreColourImageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/moderate-prompt:
    post:
      summary: Pre-moderate prompt before dispatching to image generation
      operationId: moderatePrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeratePromptRequest'
      responses:
        '200':
          description: Moderation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratePromptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/assemble-pdf:
    post:
      summary: Assemble comic book pages into PDF with disclosure and provenance metadata
      operationId: assemblePdf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssemblePdfRequest'
      responses:
        '200':
          description: PDF assembled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblePdfResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/v1/job/{id}/status:
    get:
      summary: Get background job status
      operationId: getJobStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Generation job UUID
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/characters/{id}/reference-image:
    post:
      summary: Generate or regenerate a character reference
      description: Public Go API image admission boundary. Each new idempotency key counts once against the book and user image budgets; replays do not count.
      operationId: requestCharacterImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      responses:
        '202':
          description: Image generation accepted or replayed
        '429':
          $ref: '#/components/responses/ImageBudgetExceeded'

  /api/v1/pages/{id}/draft:
    post:
      summary: Generate or regenerate a page draft
      description: Public Go API image admission boundary. Each new idempotency key counts once against the book and user image budgets; replays do not count.
      operationId: requestDraftImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      responses:
        '202':
          description: Image generation accepted or replayed
        '429':
          $ref: '#/components/responses/ImageBudgetExceeded'

  /api/v1/pages/{id}/line-art:
    post:
      summary: Generate or regenerate final line art
      description: Public Go API image admission boundary. Each new idempotency key counts once against the book and user image budgets; replays do not count.
      operationId: requestLineArtImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      responses:
        '202':
          description: Image generation accepted or replayed
        '429':
          $ref: '#/components/responses/ImageBudgetExceeded'

components:
  responses:
    ImageBudgetExceeded:
      description: Book budget (40), rolling daily cap (80), monthly cap (800), or global kill switch reached. Limits are configurable in generation_policy. Full refunds release usage; deleting projects does not restore daily capacity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImageBudgetError'
          examples:
            book:
              value:
                code: book_budget_reached
                error: 'user image generation quota exceeded: book image budget reached'
            daily:
              value:
                code: daily_image_limit_reached
                error: 'user image generation quota exceeded: daily image limit reached'
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ImageBudgetError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Present for book and daily limits; other quota and kill-switch errors retain their existing error-only response.
          enum: [book_budget_reached, daily_image_limit_reached]
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_ARGUMENT
        message:
          type: string
          example: Script input cannot be empty
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
          default: false
        retry_after_seconds:
          type: number
          nullable: true
          minimum: 0

    CharacterProfile:
      type: object
      required:
        - name
        - description
        - age_range
        - appearance
        - hair_style
        - clothing
        - personality
        - visual_attributes
      properties:
        name:
          type: string
          example: Maya
        description:
          type: string
          example: A young tech-savvy comic artist with a creative streak
        age_range:
          type: string
          example: 20-25
        appearance:
          type: string
          example: Athletic build, hazel eyes, sharp chin
        hair_style:
          type: string
          example: Short teal pixie cut
        clothing:
          type: string
          example: Black hoodie with neon yellow accents and dark denim
        personality:
          type: string
          example: Curious, resourceful, determined
        visual_attributes:
          type: object
          additionalProperties: true
          example:
            signature_prop: digital stylus
            color_tone: vibrant teal

    AnalyzeScriptRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - project_id
        - script
      properties:
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        project_id:
          type: string
          format: uuid
        script:
          type: string
        target_chapter_count:
          type: integer
          minimum: 1
          nullable: true

    AnalyzeScriptResponse:
      type: object
      required:
        - job_id
        - character_profiles
        - suggested_chapter_count
        - word_count
        - warnings
      properties:
        job_id:
          type: string
        character_profiles:
          type: array
          items:
            $ref: '#/components/schemas/CharacterProfile'
        suggested_chapter_count:
          type: integer
        word_count:
          type: integer
        warnings:
          type: array
          items:
            type: string

    GenerateCharacterReferenceRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - project_id
        - character_id
        - character_name
        - prompt
        - style
      properties:
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        project_id:
          type: string
          format: uuid
        character_id:
          type: string
          format: uuid
        character_name:
          type: string
        prompt:
          type: string
        reference_images:
          type: array
          items:
            type: string
          default: []
        style:
          type: string
          example: classic-comic

    GenerateCharacterReferenceResponse:
      type: object
      required:
        - job_id
        - image_url
        - model_id
        - provenance_metadata
      properties:
        job_id:
          type: string
        image_url:
          type: string
        model_id:
          type: string
        provenance_metadata:
          type: object
          additionalProperties: true

    ChapterOutlineItem:
      type: object
      required:
        - chapter_number
        - title
        - summary
        - important_events
        - character_names
        - ending
      properties:
        chapter_number:
          type: integer
        title:
          type: string
        summary:
          type: string
        important_events:
          type: array
          items:
            type: string
        character_names:
          type: array
          items:
            type: string
        ending:
          type: string

    GenerateChapterOutlineRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - project_id
        - script
        - chapter_count
        - approved_characters
      properties:
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        project_id:
          type: string
          format: uuid
        script:
          type: string
        chapter_count:
          type: integer
          minimum: 1
        approved_characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterProfile'

    GenerateChapterOutlineResponse:
      type: object
      required:
        - job_id
        - chapters
      properties:
        job_id:
          type: string
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/ChapterOutlineItem'

    PanelTextItem:
      type: object
      required:
        - panel_number
        - scene_description
        - character_actions
        - camera_angle
        - background
        - dialogue
        - narration
        - image_prompt
      properties:
        panel_number:
          type: integer
        scene_description:
          type: string
        character_actions:
          type: string
        camera_angle:
          type: string
        background:
          type: string
        dialogue:
          type: string
        narration:
          type: string
        image_prompt:
          type: string

    GeneratePanelTextRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - project_id
        - chapter_id
        - chapter_number
        - chapter_title
        - chapter_summary
        - characters
      properties:
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        project_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        chapter_number:
          type: integer
        chapter_title:
          type: string
        chapter_summary:
          type: string
        panel_count:
          type: integer
          minimum: 1
          default: 4
          description: Total chapter panels; generated in batches of at most five.
        chapter_script:
          type: string
          default: ''
          description: Complete source text for this chapter, without truncation.
        characters:
          type: array
          items:
            type: string

    GeneratePanelTextResponse:
      type: object
      required:
        - job_id
        - panels
      properties:
        job_id:
          type: string
        panels:
          type: array
          items:
            $ref: '#/components/schemas/PanelTextItem'

    CharacterRenderIdentity:
      type: object
      description: Stored character identity paired with its approved reference image.
      required:
        - character_id
        - name
        - description
        - visual_attributes
        - reference_image_url
      properties:
        character_id:
          type: string
        name:
          type: string
        description:
          type: string
        visual_attributes:
          type: object
          additionalProperties: true
        reference_image_url:
          type: string

    PageLetteringResponse:
      type: object
      required: [lettering_mode]
      properties:
        lettering_mode:
          type: string
          enum: [baked, overlay]
        lettering:
          $ref: '#/components/schemas/PageLetteringState'
    PageLetteringState:
      type: object
      additionalProperties: false
      required: [version, input, overrides, zone_overrides, layout]
      properties:
        version:
          type: string
          enum: [page-lettering-v1]
        input:
          $ref: '#/components/schemas/LetteringDocument'
        zone_overrides:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/LetteringUnitRect'
        overrides:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LetteringOverride'
        layout:
          $ref: '#/components/schemas/LetteringLayout'
    PatchLetteringOverrideRequest:
      type: object
      additionalProperties: false
      required: [override]
      properties:
        override:
          description: Empty object clears this utterance's manual placement.
          $ref: '#/components/schemas/LetteringOverride'
    PatchLetteringTextRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          maxLength: 8000
    PatchLetteringZonesRequest:
      type: object
      additionalProperties: false
      required: [panel_id, reserved_zones]
      properties:
        panel_id:
          type: string
        reserved_zones:
          type: array
          items:
            $ref: '#/components/schemas/LetteringUnitRect'
    GenerateDraftSketchRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - project_id
        - page_id
        - page_number
        - panels
        - style
      properties:
        lettering_document:
          $ref: '#/components/schemas/LetteringDocument'
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        project_id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        page_number:
          type: integer
        panels:
          type: array
          items:
            $ref: '#/components/schemas/PanelTextItem'
        style:
          type: string
        character_reference_image_urls:
          type: array
          items:
            type: string
          default: []

        character_identities:
          type: array
          description: Stable ordered identities; reference images precede legacy URL-only references.
          items:
            $ref: '#/components/schemas/CharacterRenderIdentity'
          default: []

    GenerateDraftSketchResponse:
      type: object
      required:
        - job_id
        - image_url
        - model_id
        - provenance_metadata
      properties:
        job_id:
          type: string
        image_url:
          type: string
        model_id:
          type: string
        provenance_metadata:
          type: object
          additionalProperties: true

    GenerateLineArtRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - project_id
        - page_id
        - page_number
        - draft_image_url
        - panels
        - style
      properties:
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        project_id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        page_number:
          type: integer
        draft_image_url:
          type: string
        panels:
          type: array
          items:
            $ref: '#/components/schemas/PanelTextItem'
        style:
          type: string
        character_reference_image_urls:
          type: array
          items:
            type: string
          default: []

        character_identities:
          type: array
          description: Stable ordered identities; reference images precede legacy URL-only references.
          items:
            $ref: '#/components/schemas/CharacterRenderIdentity'
          default: []

    GenerateLineArtResponse:
      type: object
      required:
        - job_id
        - image_url
        - model_id
        - provenance_metadata
      properties:
        job_id:
          type: string
        image_url:
          type: string
        model_id:
          type: string
        provenance_metadata:
          type: object
          additionalProperties: true

    GeneratePaintedPageRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - project_id
        - page_id
        - page_number
        - panels
        - style
        - variant
      properties:
        lettering_document:
          $ref: '#/components/schemas/LetteringDocument'
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        project_id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        page_number:
          type: integer
        draft_image_url:
          type: string
          nullable: true
          description: Approved draft sketch composition URL for draft-conditioned variant
        panels:
          type: array
          items:
            $ref: '#/components/schemas/PanelTextItem'
        style:
          type: string
        variant:
          type: string
          enum:
            - draft-conditioned
            - direct-from-brief
          description: Finished painted page variant (composition-conditioned or direct-from-brief)
        character_reference_image_urls:
          type: array
          items:
            type: string
          default: []
        character_identities:
          type: array
          description: Stable ordered identities; reference images precede legacy URL-only references.
          items:
            $ref: '#/components/schemas/CharacterRenderIdentity'
          default: []
        style_reference_image_url:
          type: string
          nullable: true

    GeneratePaintedPageResponse:
      type: object
      required:
        - job_id
        - image_url
        - model_id
        - variant
        - provenance_metadata
      properties:
        job_id:
          type: string
        image_url:
          type: string
        model_id:
          type: string
        variant:
          type: string
          enum:
            - draft-conditioned
            - direct-from-brief
        provenance_metadata:
          type: object
          additionalProperties: true

    ColourRegionSuggestion:
      type: object
      required:
        - region_name
        - hex_color
        - label
      properties:
        region_name:
          type: string
          example: background_sky
        hex_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#4A90E2'
        label:
          type: string
          example: Twilight Blue Sky

    SuggestColourPaletteRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - project_id
        - page_id
        - line_art_image_url
        - panel_context
      properties:
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        project_id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        line_art_image_url:
          type: string
        panel_context:
          type: string
        style:
          type: string
          description: Style identifier to resolve palette and color guidance from the shared style bible
          example: classic-comic

    SuggestColourPaletteResponse:
      type: object
      required:
        - job_id
        - theme
        - palette
      properties:
        job_id:
          type: string
        theme:
          type: string
        palette:
          type: array
          items:
            $ref: '#/components/schemas/ColourRegionSuggestion'

    StoreColourImageRequest:
      type: object
      required:
        - page_id
        - image_base64
        - media_type
      properties:
        page_id:
          type: string
          format: uuid
        image_base64:
          type: string
        media_type:
          type: string
          enum: [image/png, image/webp]

    StoreColourImageResponse:
      type: object
      required:
        - image_url
      properties:
        image_url:
          type: string

    ModeratePromptRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - prompt
      properties:
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        prompt:
          type: string

    ModeratePromptResponse:
      type: object
      required:
        - job_id
        - blocked
      properties:
        job_id:
          type: string
        blocked:
          type: boolean
        reason:
          type: string
          nullable: true

    PdfLetteringWarning:
      type: object
      required: [page_number, code, message]
      properties:
        page_number:
          type: integer
        code:
          type: string
          enum: [stale_lettering, lettering_review_required]
        message:
          type: string
        flags:
          type: array
          items:
            $ref: '#/components/schemas/LetteringFlag'

    PageExportItem:
      type: object
      required:
        - page_number
        - image_url
      properties:
        page_number:
          type: integer
        image_url:
          type: string
        original_image_url:
          type: string
          description: Original line art URL, retained when the exported image is a coloured derivative.
        lettering_mode:
          type: string
          enum: [baked, overlay]
          default: baked
        lettering:
          $ref: '#/components/schemas/PageLetteringState'
        lettering_stale:
          type: boolean
          default: false
          description: Stored input differs from the current source panels. Export must flag it without recomputing.
        panel_count:
          type: integer
        provenance_metadata:
          type: object
          additionalProperties: true
        panels:
          type: array
          items:
            $ref: '#/components/schemas/PanelTextItem'
        dialogue_text:
          type: string
          nullable: true

    AssemblePdfRequest:
      type: object
      required:
        - job_id
        - hashed_user_id
        - project_id
        - title
        - page_size
        - include_ai_disclosure
        - pages
      properties:
        job_id:
          type: string
          format: uuid
        hashed_user_id:
          type: string
        project_id:
          type: string
          format: uuid
        title:
          type: string
        page_size:
          type: string
          enum: [A4, US_Letter, Custom_Comic]
          default: A4
        include_ai_disclosure:
          type: boolean
          default: true
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PageExportItem'

    AssemblePdfResponse:
      type: object
      required:
        - job_id
        - pdf_url
        - provenance_metadata_preserved
        - page_count
      properties:
        job_id:
          type: string
        pdf_url:
          type: string
        provenance_metadata_preserved:
          type: boolean
        page_count:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PdfLetteringWarning'

    JobStatusResponse:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed, uncertain, cancelled]
        actual_cost:
          type: number
          nullable: true
        error_message:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        retryable:
          type: boolean
          default: false
        retry_after_seconds:
          type: number
          nullable: true
          minimum: 0

    LetteringPoint:
      type: object
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: number
        y:
          type: number
    LetteringRect:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
          minimum: 1.0e-09
        height:
          type: number
          minimum: 1.0e-09
    LetteringUnitPoint:
      type: object
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
    LetteringUnitRect:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          minimum: 1.0e-09
          maximum: 1
        height:
          type: number
          minimum: 1.0e-09
          maximum: 1
    LetteringOverride:
      type: object
      additionalProperties: false
      required: []
      properties:
        center:
          $ref: '#/components/schemas/LetteringPoint'
        rect:
          $ref: '#/components/schemas/LetteringRect'
        tail_anchor:
          $ref: '#/components/schemas/LetteringPoint'
        size_scale:
          type: number
          minimum: 1.0e-09
          maximum: 8
      description: Panel-local normalized coordinates; rect takes precedence over center.
        Exact overrides may be outside the panel and are flagged, never clamped. Scale
        changes font size, never below the configured print minimum.
    LetteringUtterance:
      type: object
      additionalProperties: false
      required:
        - utterance_id
        - order
        - kind
        - text
      properties:
        utterance_id:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0
        kind:
          type: string
          enum:
            - speech
            - thought
            - narration
            - caption
        speaker:
          type: string
        speaker_anchor:
          $ref: '#/components/schemas/LetteringUnitPoint'
        text:
          type: string
        caption_edge:
          type: string
          enum:
            - top
            - bottom
          default: top
        placement:
          $ref: '#/components/schemas/LetteringOverride'
      description: Speaker is a character ID or display name; omit for anonymous speech
        or narration. Order is unique within a panel; IDs are unique across the page.
    LetteringPanel:
      type: object
      additionalProperties: false
      required:
        - panel_id
        - order
        - rect
        - reserved_zones
        - utterances
      properties:
        panel_id:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0
        rect:
          $ref: '#/components/schemas/LetteringUnitRect'
        reserved_zones:
          type: array
          items:
            $ref: '#/components/schemas/LetteringUnitRect'
        utterances:
          type: array
          items:
            $ref: '#/components/schemas/LetteringUtterance'
      description: 'Rect is page-normalized from the page layout; zones and anchors are
        panel-local. No inferred zones: an empty array is flagged for review.'
    LetteringDocument:
      type: object
      additionalProperties: false
      required:
        - version
        - page_id
        - art_mode
        - page_aspect
        - panels
      properties:
        version:
          type: string
          enum:
            - lettering-v1
        page_id:
          type: string
          minLength: 1
        art_mode:
          type: string
          enum:
            - text_free
            - baked_in
        page_aspect:
          type: number
          minimum: 1.0e-09
          maximum: 4
          description: Physical page width / height; A4 portrait is 210/297.
        panels:
          type: array
          items:
            $ref: '#/components/schemas/LetteringPanel'
      description: Standalone opt-in lettering input. Existing page art is baked_in and
        must never receive a second lettering layer. No image pixels or image URLs are
        accepted.
    LetteringGlyph:
      type: object
      additionalProperties: false
      required:
        - glyph_id
        - cluster
        - x
        - y
        - advance_x
        - advance_y
      properties:
        glyph_id:
          type: integer
          minimum: 0
        cluster:
          type: integer
          minimum: 0
        x:
          type: number
        y:
          type: number
        advance_x:
          type: number
        advance_y:
          type: number
    LetteringTextLine:
      type: object
      additionalProperties: false
      required:
        - text
        - font_id
        - font_size
        - baseline
        - bounds
        - glyphs
      properties:
        text:
          type: string
        font_id:
          type: string
        font_size:
          type: number
        baseline:
          $ref: '#/components/schemas/LetteringPoint'
        bounds:
          $ref: '#/components/schemas/LetteringRect'
        glyphs:
          type: array
          items:
            $ref: '#/components/schemas/LetteringGlyph'
      description: Exact shaped glyph origins in page-normalized coordinates, top-left
        origin and downward Y. Font size is relative to page height; glyph IDs refer to
        the bundled versioned font. Bounds include ink and advance.
    LetteringShape:
      type: object
      additionalProperties: false
      required:
        - kind
        - bounds
        - radius
      properties:
        kind:
          type: string
          enum:
            - rounded_rect
            - ellipse
        bounds:
          $ref: '#/components/schemas/LetteringRect'
        radius:
          type: number
      description: Radius relative to page height; ellipse uses the bounds, ignoring radius.
    LetteringFlag:
      type: string
      enum:
        - empty_text
        - unsupported_glyph
        - unsupported_direction
        - overflow
        - below_minimum
        - out_of_panel
        - outside_reserved_zone
        - collision
        - tail_crosses_text
        - missing_zone
        - baked_in_art
    LetteringBubble:
      type: object
      additionalProperties: false
      required:
        - panel_id
        - utterance_id
        - order
        - kind
        - shape
        - tail
        - thought_tail
        - lines
        - flags
      properties:
        panel_id:
          type: string
          minLength: 1
        utterance_id:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0
        kind:
          type: string
          enum:
            - speech
            - thought
            - narration
            - caption
        shape:
          $ref: '#/components/schemas/LetteringShape'
        tail:
          type: array
          items:
            $ref: '#/components/schemas/LetteringPoint'
        thought_tail:
          type: array
          items:
            $ref: '#/components/schemas/LetteringShape'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LetteringTextLine'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/LetteringFlag'
    LetteringIssue:
      type: object
      additionalProperties: false
      required:
        - panel_id
        - utterance_id
        - flag
      properties:
        panel_id:
          type: string
        utterance_id:
          type: string
        flag:
          $ref: '#/components/schemas/LetteringFlag'
    LetteringLayout:
      type: object
      additionalProperties: false
      required:
        - version
        - page_id
        - page_aspect
        - minimum_font_size
        - bubbles
        - issues
      properties:
        version:
          type: string
          enum:
            - lettering-layout-v1
        page_id:
          type: string
        page_aspect:
          type: number
        source_digest:
          type: string
          description: SHA-256 of canonical effective input including placements and zones. Missing means stale for PDF export.
        stroke_width:
          type: number
          default: 0.0013
          description: Relative to page height, about 2.5px at 1280px portrait width.
        minimum_font_size:
          type: number
        bubbles:
          type: array
          items:
            $ref: '#/components/schemas/LetteringBubble'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/LetteringIssue'
      description: Serializable draw list, never append it to a previous result. All coordinates
        and bounds are page-normalized. Review issues are authoritative even when a bubble
        cannot be emitted. No renderer needs to wrap or place text again.
