name: icomic-realdb-tests

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icomic
      POSTGRES_DB: icomic_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icomic -d icomic_test"]
      interval: 1s
      timeout: 3s
      retries: 30
