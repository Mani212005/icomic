services:
  postgres:
    image: postgres:16-alpine
    container_name: icomic-postgres
    environment:
      POSTGRES_USER: icomic
      POSTGRES_PASSWORD: icomic
      POSTGRES_DB: icomic
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icomic -d icomic"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migration:
    image: postgres:16-alpine
    container_name: icomic-migration
    environment:
      DATABASE_URL: "postgres://icomic:icomic@postgres:5432/icomic?sslmode=disable"
      APPLY_SEEDS: "true"
    volumes:
      - ./:/deploy:ro
    entrypoint: ["/bin/bash", "/deploy/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    container_name: icomic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: icomic-ai
    environment:
      PORT: "8000"
      ADAPTER_LANGUAGE: "${ADAPTER_LANGUAGE:-fake}"
      ADAPTER_VISION: "${ADAPTER_VISION:-fake}"
      ADAPTER_IMAGE: "${ADAPTER_IMAGE:-fake}"
      ADAPTER_STORAGE: "${ADAPTER_STORAGE:-fake}"
      ADAPTER_QUEUE: "${ADAPTER_QUEUE:-fake}"
      ADAPTER_CLOCK: "${ADAPTER_CLOCK:-fake}"
      LETTERING_OVERLAY_ENABLED: "${LETTERING_OVERLAY_ENABLED:-false}"
      # Model IDs are shared with the backend quote configuration.
      META_IMAGE_MODEL: "${META_IMAGE_MODEL:-muse-image-1.0}"
      META_VISION_MODEL: "${META_VISION_MODEL:-muse-spark-1.3}"
      META_API_KEY: "${META_API_KEY:-}"
      META_REASONING_EFFORT: "${META_REASONING_EFFORT:-low}"
      META_REASONING_RESERVE_TOKENS: "${META_REASONING_RESERVE_TOKENS:-1024}"
      META_IMAGE_CONNECT_TIMEOUT_SECONDS: "${META_IMAGE_CONNECT_TIMEOUT_SECONDS:-10}"
      META_IMAGE_WRITE_TIMEOUT_SECONDS: "${META_IMAGE_WRITE_TIMEOUT_SECONDS:-120}"
      META_IMAGE_READ_TIMEOUT_SECONDS: "${META_IMAGE_READ_TIMEOUT_SECONDS:-300}"
      META_TEXT_CONNECT_TIMEOUT_SECONDS: "${META_TEXT_CONNECT_TIMEOUT_SECONDS:-10}"
      META_TEXT_WRITE_TIMEOUT_SECONDS: "${META_TEXT_WRITE_TIMEOUT_SECONDS:-30}"
      META_TEXT_READ_TIMEOUT_SECONDS: "${META_TEXT_READ_TIMEOUT_SECONDS:-120}"
      META_IMAGE_REFERENCE_MAX_SIDE: "${META_IMAGE_REFERENCE_MAX_SIDE:-1024}"
      META_IMAGE_REFERENCE_WEBP_QUALITY: "${META_IMAGE_REFERENCE_WEBP_QUALITY:-85}"
      META_IMAGE_MAX_REFERENCE_BYTES: "${META_IMAGE_MAX_REFERENCE_BYTES:-262144}"
      META_IMAGE_MAX_TOTAL_REFERENCE_BYTES: "${META_IMAGE_MAX_TOTAL_REFERENCE_BYTES:-2097152}"
      META_IMAGE_MAX_REQUEST_BYTES: "${META_IMAGE_MAX_REQUEST_BYTES:-3145728}"
      ICOMIC_E2E_LIVE: "${ICOMIC_E2E_LIVE:-0}"
      ICOMIC_E2E_RUN_ID: "${ICOMIC_E2E_RUN_ID:-}"
      ICOMIC_E2E_FAKE_STORAGE_DIR: "${ICOMIC_E2E_FAKE_STORAGE_DIR:-}"
      ICOMIC_E2E_DIAGNOSTICS_DIR: "${ICOMIC_E2E_DIAGNOSTICS_DIR:-}"
      ICOMIC_E2E_COST_CAP_USD: "${ICOMIC_E2E_COST_CAP_USD:-0}"
      ICOMIC_E2E_PRIOR_SPEND_USD: "${ICOMIC_E2E_PRIOR_SPEND_USD:-0}"
      ICOMIC_E2E_THIRD_CHECK_RESERVE_USD: "${ICOMIC_E2E_THIRD_CHECK_RESERVE_USD:-0}"
      STORAGE_BASE_URL: "http://ai:8000/storage/fake"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - "${ICOMIC_E2E_COST_DIR:-/tmp/icomic-e2e-costs}:/var/lib/icomic-e2e"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: icomic-backend
    environment:
      PORT: "8080"
      PYTHON_AI_URL: "http://ai:8000"
      LETTERING_OVERLAY_ENABLED: "${LETTERING_OVERLAY_ENABLED:-false}"
      DATABASE_URL: "postgres://icomic:icomic@postgres:5432/icomic?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      DEV_AUTH_ENABLED: "true"
      META_IMAGE_MODEL: "${META_IMAGE_MODEL:-muse-image-1.0}"
      META_VISION_MODEL: "${META_VISION_MODEL:-muse-spark-1.3}"
      META_IMAGE_PRICE_USD: "${META_IMAGE_PRICE_USD:-0.01}"
      META_COLOUR_ESTIMATE_USD: "${META_COLOUR_ESTIMATE_USD:-0.005}"
      PRICING_VERSION: "${PRICING_VERSION:-}"
      PRICING_VERIFIED: "${PRICING_VERIFIED:-false}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: icomic-frontend
    environment:
      PORT: "5173"
      PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
