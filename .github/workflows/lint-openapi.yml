name: Lint OpenAPI & Schemas

on:
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/lint-openapi.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/lint-openapi.yml"

jobs:
  lint-contracts:
    name: Lint OpenAPI & Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Run Schema and Contract Validation
        run: python contracts/validate_test.py
