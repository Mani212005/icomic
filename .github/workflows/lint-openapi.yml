name: Lint OpenAPI & Schemas

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/lint-openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/lint-openapi.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-contracts:
    name: Lint OpenAPI & Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: contracts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r contracts/requirements.txt

      - name: Run Schema and Contract Validation
        run: python contracts/validate_test.py
