name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic-guard:
    name: Hermetic Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Hermetic Guard Unit Tests
        run: |
          python scripts/check_hermetic_test.py
          python scripts/check_generated_test.py

      - name: Run Hermetic Guard Repository Verification
        run: python scripts/check_hermetic.py

  contracts:
    name: Contracts & Schemas Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: contracts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r contracts/requirements.txt

      - name: Validate OpenAPI spec and JSON schemas
        run: python contracts/validate_test.py

  contract-models:
    name: OpenAPI Generated Model Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned OpenAPI model generators
        run: make install-contract-codegen

      - name: Check generated Go and Python models
        run: make check-contract-models

  database:
    name: Database Migrations & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Hermetic Migration Structural Validation
        run: python3 deploy/validate_migrations_test.py

  backend-realdb:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: icomic
          POSTGRES_PASSWORD: icomic
          POSTGRES_DB: icomic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icomic -d icomic_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tagged PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://icomic:icomic@127.0.0.1:5432/icomic_test?sslmode=disable
        run: make test-backend-realdb

  backend:
    name: Go Backend Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go Formatting
        run: |
          cd backend
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: |
          cd backend
          go vet ./...

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "ai/uv.lock"

      - name: Set up Python for Boundary Contract Tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install AI Service Dependencies for Boundary Contract Tests
        run: |
          cd ai
          uv sync --locked

      - name: Run Hermetic Unit & Contract Tests
        run: |
          cd backend
          go test -v -race ./...

      - name: Build Go Backend
        run: |
          cd backend
          go build -v ./...

  ai-service:
    name: Python AI Service Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "ai/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          cd ai
          uv sync --locked

      - name: Lint and Format Check (Ruff)
        run: |
          cd ai
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Run Hermetic Unit & Contract Tests
        run: |
          cd ai
          uv run --frozen pytest -v

  frontend:
    name: Svelte Frontend Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint & Type Check (svelte-check)
        run: |
          cd frontend
          npm run check

      - name: Run Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Application
        run: |
          cd frontend
          npm run build

  e2e:
    name: End-to-End API Integration Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "ai/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install AI Service Dependencies
        run: |
          cd ai
          uv sync --locked

      - name: Run End-to-End Suite
        run: make test-e2e

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - hermetic-guard
      - contracts
      - contract-models
      - database
      - backend
      - backend-realdb
      - ai-service
      - frontend
      - e2e
    if: always()
    steps:
      - name: Check Status of All CI Jobs
        run: |
          echo "Evaluating CI job statuses..."
          has_failure=0
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "Required job result: '$result' (expected: success)"
              has_failure=1
            fi
          done
          if [ $has_failure -ne 0 ]; then
            echo "CI run failed: one or more dependent jobs did not succeed."
            exit 1
          fi
          echo "All required CI jobs succeeded!"
