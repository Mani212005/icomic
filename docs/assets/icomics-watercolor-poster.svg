<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
  <title id="title">Icomic watercolor comic poster</title>
  <desc id="desc">An inked comic book page opens into a moonlit city, painted in indigo, teal and coral watercolor.</desc>
  <defs>
    <linearGradient id="paper" x2=".16" y2="1">
      <stop stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#f1dfbd"/>
    </linearGradient>
    <linearGradient id="night" x2=".1" y2="1">
      <stop stop-color="#24395d"/>
      <stop offset=".48" stop-color="#315d70"/>
      <stop offset="1" stop-color="#d78064"/>
    </linearGradient>
    <linearGradient id="book" x2="0" y2="1">
      <stop stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#e9d9bc"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop stop-color="#fff8d8" stop-opacity=".98"/>
      <stop offset=".66" stop-color="#f5d69a" stop-opacity=".82"/>
      <stop offset="1" stop-color="#f5d69a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washCoral">
      <stop stop-color="#e77d68" stop-opacity=".65"/>
      <stop offset="1" stop-color="#e77d68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washTeal">
      <stop stop-color="#72a9a0" stop-opacity=".54"/>
      <stop offset="1" stop-color="#72a9a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper-grain" x="-.1" y="-.1" width="1.2" height="1.2">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="wash-edge" x="-.12" y="-.12" width="1.24" height="1.24">
      <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="13" result="paper"/>
      <feDisplacementMap in="SourceGraphic" in2="paper" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft-shadow" x="-.3" y="-.3" width="1.6" height="1.6">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="upper-page">
      <path d="M236 248 Q780 187 1363 255 L1352 1116 Q808 1047 253 1124Z"/>
    </clipPath>
    <clipPath id="lower-page">
      <path d="M250 1137 Q800 1079 1350 1143 L1356 1616 Q804 1568 245 1628Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="2000" fill="url(#paper)" filter="url(#paper-grain)"/>
